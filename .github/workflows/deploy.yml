name: Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  issues: write
  contents: write
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test

  deploy:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Validate rest notification secrets
        run: |
          if [ -z "$VAPID_PUBLIC_KEY" ] || [ -z "$VAPID_PRIVATE_KEY" ]; then
            echo "::error::VAPID_PUBLIC_KEY and VAPID_PRIVATE_KEY GitHub Actions secrets are required"
            exit 1
          fi
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}

      - name: Apply D1 migrations
        run: yarn db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ensure rest notification queue
        run: |
          if ! yarn workspace @macromaxxing/workers wrangler queues info macromaxxing-rest-notifications; then
            yarn workspace @macromaxxing/workers wrangler queues create macromaxxing-rest-notifications
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy rest notification consumer
        run: yarn workspace @macromaxxing/workers wrangler deploy --config rest-notifications/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure rest notification consumer
        run: |
          printf '%s' "$VAPID_PUBLIC_KEY" | yarn workspace @macromaxxing/workers wrangler secret put VAPID_PUBLIC_KEY --config rest-notifications/wrangler.toml
          printf '%s' "$VAPID_PRIVATE_KEY" | yarn workspace @macromaxxing/workers wrangler secret put VAPID_PRIVATE_KEY --config rest-notifications/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}

      - name: Configure rest notification Pages secrets
        run: |
          printf '%s' "$VAPID_PUBLIC_KEY" | yarn workspace @macromaxxing/workers wrangler pages secret put VAPID_PUBLIC_KEY --project-name=${{ github.event.repository.name }}
          printf '%s' "$VAPID_PRIVATE_KEY" | yarn workspace @macromaxxing/workers wrangler pages secret put VAPID_PRIVATE_KEY --project-name=${{ github.event.repository.name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}

      - name: Build
        run: yarn build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_R2_BASE_URL: ${{ vars.VITE_R2_BASE_URL }}

      - name: Deploy to Cloudflare Pages
        run: yarn workspace @macromaxxing/workers wrangler pages deploy --project-name=${{ github.event.repository.name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  release:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: yarn semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
